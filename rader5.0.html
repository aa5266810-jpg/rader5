<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龍珠雷達 DRAGON RADAR</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
    .panel { background: rgba(255,255,255,0.08); padding: 15px; border-radius: 10px; margin-bottom: 15px; display: inline-block; text-align: left; width: 90%; max-width: 360px; box-sizing: border-box; }
    input { width: 100%; padding: 8px; margin: 5px 0 10px 0; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
    button { width: 100%; background: #f39c12; border: none; color: white; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; margin: 4px 0; font-size: 15px; }
    button.blue { background: #2980b9; }
    #status { color: #2ecc71; font-size: 13px; margin-top: 10px; white-space: pre-line; line-height: 1.4; }
    #radarCanvas { background: #000; border: 4px solid #f39c12; border-radius: 50%; display: block; margin: 10px auto; }
  </style>
</head>
<body>

  <h2>🐉 龍珠雷達 (全功能整合版)</h2>

  <div class="panel">
    <label>1. 目標經緯度：</label>
    <input type="number" id="targetLat" step="any" placeholder="緯度 (Lat) 例如: 22.650123">
    <input type="number" id="targetLng" step="any" placeholder="經度 (Lng) 例如: 120.312456">
    
    <button class="blue" onclick="connectBluetooth()">1. 連線藍芽龍珠 (BLE)</button>
    <button onclick="startGPSTracking()">2. 啟動 GPS 與指南針追蹤</button>
    <button onclick="triggerSearchSound()">3. 手動發出逼逼聲 🔊</button>
    
    <div id="status">狀態：等待操作...</div>
  </div>

  <canvas id="radarCanvas" width="300" height="300"></canvas>

  <script>
    let userLat = 0, userLng = 0, userHeading = 0;
    let bleDevice, bleServer;
    let currentRSSI = -100;
    let autoBeepInterval = null;

    // --- 音效系統 (利用 Web Audio API 合成) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeepSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880; // 高音 880Hz
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.12);
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function triggerSearchSound() {
      let count = 0;
      const interval = setInterval(() => {
        playBeepSound();
        count++;
        if (count >= 8) clearInterval(interval);
      }, 200);
    }

    // --- 1. Web Bluetooth 連線與訊號 (RSSI) 監測 ---
    async function connectBluetooth() {
      try {
        updateStatus("搜尋藍芽裝置中...");
        bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['generic_access']
        });

        bleServer = await bleDevice.gatt.connect();
        updateStatus("✅ 藍芽連線成功！正在監控訊號強度...");

        // 啟動 RSSI 訊號檢測 loop
        startRSSIMonitor();
      } catch (error) {
        updateStatus("❌ 藍芽連線失敗：" + error.message);
      }
    }

    function startRSSIMonitor() {
      setInterval(async () => {
        if (bleServer && bleServer.connected) {
          try {
            // 讀取訊號強度 (部分瀏覽器支援 getRSSI)
            if (bleDevice.watchAdvertisements) {
              await bleDevice.watchAdvertisements();
            }
          } catch (e) {
            console.log("RSSI 讀取限制:", e);
          }
        }
      }, 2000);

      // 自動逼逼聲邏輯：當 RSSI 訊號大於 -70dBm (距離很近時) 自動觸發
      setInterval(() => {
        if (currentRSSI > -70) {
          playBeepSound();
        }
      }, 1000);
    }

    // --- 2. GPS 定位與指南針角度運算 ---
    function startGPSTracking() {
      // 請求 iOS 指南針權限
      if (window.DeviceOrientationEvent) {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(res => {
            if (res === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation, true);
            }
          });
        } else {
          window.addEventListener('deviceorientation', handleOrientation, true);
        }
      }

      // 啟動手機 GPS 監聽
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLng = pos.coords.longitude;
            updateRadarDisplay();
          },
          (err) => updateStatus("GPS 失敗：" + err.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      }
    }

    function handleOrientation(event) {
      if (event.webkitCompassHeading) {
        userHeading = event.webkitCompassHeading; // iOS 專用磁北角
      } else if (event.alpha) {
        userHeading = 360 - event.alpha;
      }
      updateRadarDisplay();
    }

    // 經緯度極座標轉相對方位角與距離
    function updateRadarDisplay() {
      const targetLat = parseFloat(document.getElementById('targetLat').value);
      const targetLng = parseFloat(document.getElementById('targetLng').value);

      if (!targetLat || !targetLng || userLat === 0) return;

      const R = 6371e3; // 地球半徑 (公尺)
      const φ1 = userLat * Math.PI / 180;
      const φ2 = targetLat * Math.PI / 180;
      const Δφ = (targetLat - userLat) * Math.PI / 180;
      const Δλ = (targetLng - userLng) * Math.PI / 180;

      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const distance = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      let bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;

      // 算出來的角度：相對於手機朝向的正前方 (0 度為正上方)
      let relativeAngle = (bearing - userHeading + 360) % 360;

      updateStatus(`距離龍珠：${distance.toFixed(1)} 公尺\n相對角度：${relativeAngle.toFixed(0)}°`);
      drawRadar(relativeAngle, distance);
    }

    // --- 3. 雷達畫布 (Canvas) 繪製 ---
    function drawRadar(angle, distance) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 雷達綠色同心圓網格
      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, 40, 0, Math.PI * 2);
      ctx.arc(cx, cy, 80, 0, Math.PI * 2);
      ctx.arc(cx, cy, 120, 0, Math.PI * 2);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
      ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
      ctx.stroke();

      // 極座標轉直角座標
      const rad = (angle - 90) * Math.PI / 180;
      const maxDisplayDist = 50; // 最外圈代表 50 公尺
      const drawDist = Math.min(distance, maxDisplayDist) * (120 / maxDisplayDist);

      const px = cx + drawDist * Math.cos(rad);
      const py = cy + drawDist * Math.sin(rad);

      // 繪製紅黃閃爍龍珠光點
      ctx.fillStyle = '#ff3300';
      ctx.beginPath();
      ctx.arc(px, py, 7, 0, Math.PI * 2);
      ctx.fill();
    }

    function updateStatus(msg) {
      document.getElementById('status').innerText = msg;
    }
  </script>
</body>
</html>
